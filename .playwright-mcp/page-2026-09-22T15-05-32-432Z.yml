          - heading "Supply & Installation" [level=3] [ref=f1e149]
          - paragraph [ref=f1e150]: End-to-end turnkey installation including shaft survey, civil works guidance, electrical integration and commissioning by our own certified engineers.
        - generic [ref=f1e152]:
