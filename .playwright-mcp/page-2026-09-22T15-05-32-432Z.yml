        - paragraph [ref=f1e141]: What We Do
        - heading "Complete elevator solutions, under one roof" [level=2] [ref=f1e142]
        - paragraph [ref=f1e143]: From the first site survey to decades of maintenance, Deenar handles every stage of your lift's life cycle.
