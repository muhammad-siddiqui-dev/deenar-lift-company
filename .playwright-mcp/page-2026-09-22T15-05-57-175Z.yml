      - paragraph [ref=f2e50]: About Us
      - heading "A manufacturer that stands behind every lift it builds" [level=1] [ref=f2e51]
      - paragraph [ref=f2e52]: Deenar Lift Company designs, manufactures, installs and maintains the lifts that families and businesses across Pakistan rely on every single day.
    - generic [ref=f2e54]:
      - generic [ref=f2e55]:
        - generic [ref=f2e57]:
          - paragraph [ref=f2e60]: Our Story
          - heading "A Karachi company with an engineer's obsession" [level=2] [ref=f2e61]
        - generic [ref=f2e62]:
          - paragraph [ref=f2e64]: "Deenar Lift Company was founded on a simple frustration: buildings in Pakistan were being forced to choose between expensive imported lifts and unreliable local ones. We set out to build a better third option — a lift manufactured locally, to international standards, with honest pricing."
          - paragraph [ref=f2e66]: "Today we manufacture a complete range of lifts in our Karachi facility: passenger lifts, home lifts, freight lifts and hospital lifts. Every unit is designed for Pakistan's reality — its summer heat, its power fluctuations and its dense residential towers."
          - paragraph [ref=f2e68]: Our promise is simple. We build it. We install it. We stand behind it for the life of the building.
      - img "Modern building architecture" [ref=f2e73]
    - generic [ref=f2e76]:
      - generic [ref=f2e77]:
        - paragraph [ref=f2e80]: Our Mission
        - paragraph [ref=f2e81]: To make safe, modern vertical transportation accessible to every building in Pakistan — homes, offices, hospitals and industries.
      - generic [ref=f2e82]:
        - paragraph [ref=f2e85]: Our Vision
        - paragraph [ref=f2e86]: To be Pakistan's most trusted lift brand — the first name that comes to mind when a building goes vertical.
      - generic [ref=f2e87]:
        - paragraph [ref=f2e90]: The Deenar Promise
        - paragraph [ref=f2e91]: Free site survey. Itemized quotation in PKR. Certified installation. Genuine spare parts. Responsive breakdown support — for the life of your lift.
